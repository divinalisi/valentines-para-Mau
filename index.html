        .instruccion {

                    htmlContent += `<img src="${item.foto}" style="display:block;">`;

                    htmlContent += `<h1 style="font-size:100px;">🎁</h1>`;
                }

                container.innerHTML = htmlContent;
                indice++;
            } else {

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi San Valentín ❤️</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffebee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 85%;
            width: 400px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .container:active {
            transform: scale(0.98);
        }
        /* ESTA PARTE ES LA QUE ARREGLA LAS FOTOS */
        #contenido img {
            width: 100%;
            border-radius: 15px;
            display: block; /* Asegura que se vean */
            margin-top: 15px;
            animation: fadeIn 0.6s;
            max-height: 450px;
            object-fit: cover;
        }
        h2 {
            color: #d32f2f;
            margin-top: 15px;
            font-size: 1.2rem;
        }
        .instruccion {
            font-size: 0.8em;
            color: #999;
            margin-top: 10px;
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

<div id="youtube-widget" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; width: 220px; overflow: hidden; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); background: white;">
    <iframe id="reproductor-yt" width="100%" height="120" src="" frameborder="0" allow="autoplay; encrypted-media;" allowfullscreen></iframe>
</div>

<div class="container" onclick="siguienteSorpresa()">
    <div id="contenido">
        <h1 style="color: #d32f2f; font-size: 50px; margin: 0;">❤️</h1>
        <h2>Toca para ver nuestra historia...</h2>
        <p class="instruccion">(Haz clic aquí para avanzar)</p>
    </div>
</div>

        const videoIdPrincipal = listaShuffle[0];
        const listaIDs = listaShuffle.join(',');
        const urlFinal = "https://www.youtube.com/embed/" + videoIdPrincipal + "?playlist=" + listaIDs + "&loop=1&controls=1&rel=0";
        document.getElementById('reproductor-yt').src = urlFinal;
    })();

    let indice = 0;

    function siguienteSorpresa() {
        const container = document.getElementById('contenido');
        
        if (indice < sorpresas.length) {
            const item = sorpresas[indice];
            let htmlContent = `<h2>${item.texto}</h2>`;
            
            if (item.foto !== "") {
                htmlContent += `<img src="${item.foto}" alt="Imagen de San Valentín">`;
            } else {
                htmlContent += `<h1 style="font-size:80px; margin: 20px 0;">🎁</h1>`;
            }

            container.innerHTML = htmlContent;
            indice++;
        } else {
            indice = 0;
            container.innerHTML = `
                <h1 style="font-size: 50px;">❤️</h1>
                <h2>¿Empezamos de nuevo miamor?</h2>
                <p class="instruccion">Toca para reiniciar</p>
            `;
        }
    }
</script>
</body>
</html>
